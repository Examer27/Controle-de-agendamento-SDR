<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#6a7686;--bd:#dde2ea;--ac:#2f2f2f;--ok:#16a34a;--no:#dc2626;--op:#cbd5e1}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mu:#94a1b2;--bd:#2d3744;--ac:#6b7280;--ok:#34c26b;--no:#f0605d;--op:#475569}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mu:#94a1b2;--bd:#2d3744;--ac:#6b7280;--ok:#34c26b;--no:#f0605d;--op:#475569}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
.top{text-align:center;margin-bottom:14px}.logo{display:inline-block;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 24px;margin-bottom:10px;max-width:100%}.logo img{display:block;width:280px;max-width:100%;height:auto}h1{font-size:20px;margin:4px 0 0}
h2{font-size:16px;margin:0 0 10px}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;margin-bottom:10px}
.row input,.row select{flex:1}
.row .btn{width:auto;white-space:nowrap}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
li:last-child{border:0}
.x{background:none;border:0;color:var(--no);cursor:pointer;font-size:16px}
.mu{color:var(--mu);font-size:13px}
.vez{background:#dc2626;color:#fff;border-radius:10px;padding:14px;margin-bottom:12px}
li.vez-row{background:#16a34a;color:#fff;border-radius:8px;padding:8px 10px;border-bottom:0}li.vez-row .mu{color:#e8fbe9}li.vez-row .btn{color:#fff;border-color:#fff}li.vez-row .tag{background:#fff;color:#16a34a}
.vez b{font-size:22px;display:block}
.tag{font-size:11px;background:var(--ok);color:#fff;border-radius:99px;padding:2px 8px}
.w{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:middle}
th{color:var(--mu);font-weight:600;font-size:12px}
td select{min-width:110px;padding:5px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--op);min-width:100px}
.bar i{display:block;height:100%}
.msg{padding:10px;border:1px dashed var(--bd);border-radius:8px;color:var(--mu);margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi b{font-size:24px;display:block}
</style>

(function(){

function snapDoc(p){var has=Object.prototype.hasOwnProperty.call(S,p);var v=has?JSON.parse(JSON.stringify(S[p])):undefined;return{id:p.split("/").pop(),exists:has,data:function(){return v}}}

linhas+='<tr><td>'+esc(n)+'</td><td>'+l.length+'</td><td>'+c+'</td><td>'+g+'</td><td>'+p+'</td><td>'+ab+'</td><td>'+pct(g,l.length)+'</td><td>'+pct(p,l.length)+'</td><td>'+pct(g+p,l.length)+'</td><td>'+nc(l)+'</td><td><div class="bar" title="Ganho / Perdido / Em aberto"><i style="width:'+w(g)+'%;background:var(--ok)"></i><i style="width:'+w(p)+'%;background:var(--no)"></i></div></td></tr>'});

h+='<div class="card"><h2>Por gerente de estudo</h2><div class="w"><table><thead><tr><th>Gerente</th><th>Agend.</th><th>Compar.</th><th>Ganho</th><th>Perdido</th><th>Em aberto</th><th>% Ganho</th><th>% Perdido</th><th>% Finalizado</th><th>Cursos</th><th>Ganho × perdido</th></tr></thead><tbody>'+(linhas||'<tr><td colspan="11" class="mu">Sem dados</td></tr>')+'</tbody></table></div><p class="mu">Percentuais calculados sobre o total de agendamentos vinculados a cada gerente.</p></div>';
var ss=porSdr().map(function(x){return '<tr><td>'+esc(x.n)+'</td><td>'+x.t+'</td><td>'+x.c+'</td><td>'+x.g+'</td><td>'+x.p+'</td><td>'+pct(x.g,x.t)+'</td></tr>'}).join('');
h+='<div class="card"><h2>Agendamentos por SDR</h2><div class="w"><table><thead><tr><th>SDR</th><th>Agendamentos</th><th>Compareceram</th><th>Ganho</th><th>Perdido</th><th>% Ganho</th></tr></thead><tbody>'+(ss||'<tr><td colspan="6" class="mu">Sem dados</td></tr>')+'</tbody></table></div></div>';
var so=porOrigem().map(function(x){return '<tr><td>'+esc(x.n)+'</td><td>'+x.t+'</td><td>'+pct(x.t,T.n)+'</td><td>'+x.c+'</td><td>'+x.g+'</td><td>'+x.p+'</td><td>'+pct(x.g,x.t)+'</td></tr>'}).join('');
h+='<div class="card"><h2>Agendamentos por origem do candidato</h2><div class="w"><table><thead><tr><th>Origem</th><th>Agendamentos</th><th>% do total</th><th>Compareceram</th><th>Ganho</th><th>Perdido</th><th>% Ganho</th></tr></thead><tbody>'+(so||'<tr><td colspan="7" class="mu">Sem dados</td></tr>')+'</tbody></table></div></div>';
document.getElementById("v-dash").innerHTML=h}

function render(){nav();["cad","fila","ag","dash"].forEach(function(k){document.getElementById("v-"+k).hidden=aba!==k});
if(aba==="cad")rCad();else if(aba==="fila")rFila();else if(aba==="ag")rAg();else rDash()}
render();
var tm=setTimeout(function(){if(!pronto)document.getElementById("aviso").textContent="Não foi possível conectar ao banco de dados. Abra a página logado no claude.ai."},10000);
function ok(){pronto=true;clearTimeout(tm);document.getElementById("aviso").hidden=true}
(async function(){
 try{db=await claude.use("db")}catch(e){db=null}
 if(!db){return}
 ok();
 db.collection("cadastros").onSnapshot(function(s){cad=s.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x});var n={gerentes:[],sdrs:[],etapas:[],origens:[],cursos:[],canais:[],inativos:cfg.inativos||[],ultimo:cfg.ultimo};cad.forEach(function(c){if(n[c.lista])n[c.lista].push(c.nome)});cfg=n;render()},erro);
 db.doc("fila/estado").onSnapshot(function(s){cfg.ultimo=s.exists?(s.data().ultimo||""):"";render()},erro);
 db.doc("fila/inativos").onSnapshot(function(s){cfg.inativos=s.exists?(s.data().lista||[]):[];render()},erro);
 db.collection("agendamentos").onSnapshot(function(s){ags=s.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x});if(aba==="ag"){var ae=document.activeElement;if(ae&&ae.tagName==="INPUT"&&ae.closest("#f"))return}render()},erro);
})();
</script>
