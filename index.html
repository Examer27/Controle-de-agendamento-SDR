<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluxo de qualificação SDR</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#6a7686;--bd:#dde2ea;--ac:#2f2f2f;--ok:#16a34a;--no:#dc2626;--am:#ca8a04;--op:#cbd5e1}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mu:#94a1b2;--bd:#2d3744;--ac:#6b7280;--ok:#34c26b;--no:#f0605d;--am:#facc15;--op:#475569}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mu:#94a1b2;--bd:#2d3744;--ac:#6b7280;--ok:#34c26b;--no:#f0605d;--am:#facc15;--op:#475569}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
.top{text-align:center;margin-bottom:14px}.logo{display:inline-block;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 24px;margin-bottom:10px;max-width:100%}.logo img{display:block;width:280px;max-width:100%;height:auto}h1{font-size:20px;margin:4px 0 0}
h2{font-size:16px;margin:0 0 10px}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;margin-bottom:10px}
.row input,.row select{flex:1}
.row .btn{width:auto;white-space:nowrap}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
li:last-child{border:0}
.x{background:none;border:0;color:var(--no);cursor:pointer;font-size:16px}
.mu{color:var(--mu);font-size:13px}
.vez{background:#dc2626;color:#fff;border-radius:10px;padding:14px;margin-bottom:12px}
li.vez-row{background:#16a34a;color:#fff;border-radius:8px;padding:8px 10px;border-bottom:0}li.vez-row .mu{color:#e8fbe9}li.vez-row .btn{color:#fff;border-color:#fff}li.vez-row .tag{background:#fff;color:#16a34a}
.vez b{font-size:22px;display:block}
.tag{font-size:11px;background:var(--ok);color:#fff;border-radius:99px;padding:2px 8px}
.sim{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}.sim .card{margin-bottom:0;display:flex;flex-direction:column;min-width:0}.sim h2{text-align:center}.sim table{min-width:420px}.rol{overflow:auto;max-height:520px;flex:1}.badge{text-align:center;margin-bottom:12px}@media(max-width:760px){.sim{grid-template-columns:1fr}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.modal{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto}.modal textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
.acc-wrap{max-width:760px;margin:8px auto}.acc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:14px 0}
.acc-btn{border:0;border-radius:16px;padding:26px 14px;color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer;text-align:center;line-height:1.3}.acc-btn small{display:block;font-weight:400;font-size:12.5px;opacity:.9;margin-top:6px}.acc-btn:hover{filter:brightness(1.08)}
#acc-form{max-width:380px;margin:0 auto;border-width:2px}
tr.novo td{color:#dc2626}tr.ok td{color:#16a34a}@media (prefers-color-scheme:dark){tr.novo td{color:#f87171}tr.ok td{color:#4ade80}}
.g{color:var(--ok)}.p{color:var(--no)}
.r-g,.r-p,.r-a{font-weight:700}.r-g{color:var(--ok)}.r-p{color:var(--no)}.r-a{color:var(--am)}option[value=""]{color:var(--tx)}option[value="Fechado Ganho"]{color:var(--ok)}option[value="Fechado Perdido"]{color:var(--no)}option[value="Em andamento"]{color:var(--am)}
.cracha{display:block;width:fit-content;max-width:100%;text-align:center;border:3px solid #e5290e;border-radius:20px;padding:14px 40px;background:#e5290e;margin:2px auto 16px}.cracha div{font-size:30px;line-height:1.2;font-weight:800;word-break:break-word;color:#fff}
main.wide{max-width:min(1880px,100%)}main.wide table{min-width:0}main.wide th,main.wide td{padding:6px 5px;font-size:13px}main.wide th{font-size:12px}main.wide td select{min-width:0;width:auto;max-width:100%;padding:4px}main.wide .btn{padding:6px 8px;font-size:12px}
.w{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:middle}
th{color:var(--mu);font-weight:600;font-size:12px}
td select{min-width:110px;padding:5px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--op);min-width:100px}
.bar i{display:block;height:100%}
.msg{padding:10px;border:1px dashed var(--bd);border-radius:8px;color:var(--mu);margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi b{font-size:24px;display:block}
main.wide{max-width:none;width:100%;box-sizing:border-box;padding:12px 16px}
main.wide .w{overflow-x:visible}
main.wide table,main.wide .sim table{width:100%;min-width:0;table-layout:auto}
main.wide th,main.wide td{white-space:normal;overflow-wrap:break-word;word-break:normal}
main.wide td .mu{overflow-wrap:anywhere}
main.wide td.ct{min-width:150px}
main.wide td .btn{padding:4px 7px;font-size:12px}
main.wide .bar{min-width:60px}
main.wide.apertado th,main.wide.apertado td{overflow-wrap:anywhere;font-size:12px}
</style>

 var h='<div class="modal-bg" id="mbg"><div class="modal"><h2>Qualificação do lead'+(a.nome?' – '+esc(a.nome):'')+'</h2><div class="mu" style="margin-bottom:6px">Histórico do que o lead informou</div><textarea id="q-txt" rows="9" placeholder="Escreva aqui o histórico do que o lead informou...">'+esc(a.qualificacao||"")+'</textarea><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn sec" id="q-x">Cancelar</button>'+(tem?'<button class="btn sec" id="q-del">Excluir</button>':'')+'<button class="btn" id="q-ok">'+(tem?'Alterar':'Inserir')+'</button></div></div></div>';
 document.getElementById("modal").innerHTML=h;
 document.getElementById("q-x").onclick=fecharModal;
 document.getElementById("q-ok").onclick=function(){var t=document.getElementById("q-txt").value.trim();if(!t){aviso("Escreva a qualificação antes de salvar.");return}
  if(novo){qualRasc=t;fecharModal();attBtnQ();return}
  if(!db){erro("sem conexão com o banco de dados");return}db.doc("agendamentos/"+id).update({qualificacao:t}).then(fecharModal).catch(erro)};
 var d=document.getElementById("q-del");if(d)d.onclick=function(){if(!conf){conf=true;d.textContent="Confirmar exclusão?";return}
  if(novo){qualRasc="";fecharModal();attBtnQ();return}
  if(!db)return;db.doc("agendamentos/"+id).update({qualificacao:""}).then(fecharModal).catch(erro)}}
function rVis(){var s=document.getElementById("v-vis"),todos=(gerSel==="__todos"||!gerSel),dia=gDia||hoje(),mes=gMes||hoje().slice(0,7);
var base=ags.filter(function(a){return todos||a.gerente===gerSel});
var r=selecao(base,gModo,dia,mes),lista=r.lista;
var cab='<div class="cracha"><div>Gerente de estudos</div><div class="cr-n">'+esc(todos?"Fila toda":gerSel)+'</div></div>';
var t;
if(todos){t='<div class="w"><table><thead><tr><th>#</th><th>Marcação</th><th>Reunião</th><th>Lead</th><th>Gerente de estudos</th><th>SDR</th><th>Curso</th><th>Status</th></tr></thead><tbody>';
 lista.forEach(function(a){var at=stat(a)==="Atendido";t+='<tr class="'+(at?'ok':'novo')+'"><td>'+r.num[a.id]+'</td><td>'+fmtReg(a.criado)+'</td><td>'+(a.data?fmt(a.data):esc(a.canal))+'</td><td>'+esc(a.nome)+sfLink(a)+'</td><td>'+esc(a.gerente)+'</td><td>'+esc(a.sdr)+'</td><td>'+esc(a.curso)+'</td><td><b>'+(at?'Atendido':'Novo')+'</b></td></tr>'});
 if(!lista.length)t+='<tr><td colspan="8" class="mu">Nenhum registro de atendimento nesta seleção</td></tr>'}
else{t='<div class="w"><table><thead><tr><th>#</th><th>Marcação</th><th>Reunião</th><th>Lead</th><th>Contato</th><th>Origem</th><th>SDR</th><th>Gerente</th><th>Curso</th><th>Canal</th><th>Status</th><th>Compareceu</th><th>Resultado</th><th>Qualificação e Conclusão</th><th>Situação</th></tr></thead><tbody>';
 lista.forEach(function(a){var at=stat(a)==="Atendido";t+='<tr><td>'+r.num[a.id]+'</td><td>'+fmtReg(a.criado)+'</td><td>'+(a.data?fmt(a.data)+lnk(a):esc(a.canal))+'</td><td>'+esc(a.nome)+sfLink(a)+'</td><td class="ct">'+esc(a.telefone)+'<br><span class="mu">'+esc(a.email)+'</span></td><td>'+esc(a.origem)+'</td><td>'+esc(a.sdr)+'</td><td>'+esc(a.gerente)+'</td><td>'+esc(a.curso)+'</td><td>'+esc(a.canal)+'</td><td>'+(at?'<b class="g">Atendido</b>':'<button class="btn" data-ini="'+a.id+'">Atender</button>')+'</td><td>'+(a.data?'<select data-id="'+a.id+'" data-k="compareceu"'+(at?'':' disabled')+'>'+selOp(["Sim","Não"],a.compareceu)+'</select>':'')+'</td><td><select class="'+resCls(a.resultado)+'" data-id="'+a.id+'" data-k="resultado"'+(!at||(a.compareceu==="Não"&&a.resultado==="Fechado Perdido")?' disabled':'')+'>'+selRes(a.resultado,true)+'</select></td><td><button class="btn sec" style="white-space:normal;min-width:0" data-lead="'+a.id+'">Dados de qualificação e conclusão</button></td><td>'+(at?'<b class="g" style="font-size:20px" title="Atendido">✓</b>':'<b class="g">Novo</b>')+'</td></tr>'});
 if(!lista.length)t+='<tr><td colspan="15" class="mu">Nenhum lead vinculado a você nesta seleção</td></tr>'}
t+='</tbody></table></div>';
s.innerHTML=cab+'<div class="card"><h2 style="text-align:center">Fila de atendimento</h2>'+filaIcones(0)+'</div><div class="card"><h2>'+(todos?'Fila toda':'Meus leads')+' ('+r.tot+')</h2>'+ctlSel("vg",r,dia,mes)+'<p class="mu" style="margin-top:0">Mostrando '+r.desc+' ('+lista.length+').'+(todos?' A qualificação só aparece para os leads do gerente selecionado.':'')+'</p>'+t+'</div>';
s.querySelectorAll("[data-lead]").forEach(function(b){b.onclick=function(){abrirLead(b.dataset.lead)}});s.querySelectorAll("[data-ini]").forEach(function(b){b.onclick=function(){atender(b.dataset.ini)}});s.querySelectorAll("select[data-id]").forEach(function(e){e.onchange=function(){setCampo(e.dataset.id,e.dataset.k,e.value)}});
var gm=document.getElementById("vg-modo");if(gm){gm.value=valModo(r.modo);gm.onchange=function(){gModo=gm.value;render()}}var gd=document.getElementById("vg-dia");if(gd)gd.onchange=function(){gDia=gd.value;render()};var gmm=document.getElementById("vg-mes");if(gmm)gmm.onchange=function(){gMes=gmm.value;render()}}
function render(){if(!ini)return;document.querySelector("main").classList.toggle("wide",!!PERFIL);var cs=document.getElementById("cab-sdr");if(cs)cs.innerHTML=PERFIL==="sdr"?'<div class="cracha"><div>Agente SDR</div><div class="cr-n">'+esc(userNome)+'</div></div>':"";var n0=document.getElementById("nav"),ac=document.getElementById("v-acesso"),T=["cad","fila","ag","dash","vis","usr"];
 if(!PERFIL){n0.innerHTML="";T.forEach(function(k){document.getElementById("v-"+k).hidden=true});ac.hidden=false;popGer();return}
 ac.hidden=true;
 if(PERFIL==="gerente"){n0.innerHTML="";var b=document.createElement("button");b.textContent="Sair ("+NOMEP.gerente+")";b.className="btn sec";b.onclick=sair;n0.appendChild(b);T.forEach(function(k){document.getElementById("v-"+k).hidden=(k!=="vis")});rVis();ajustaLargura();return}
 if(PERFIL!=="admin"&&(aba==="cad"||aba==="usr"))aba="fila";
 document.getElementById("v-vis").hidden=true;nav();
 ["cad","fila","ag","dash","usr"].forEach(function(k){document.getElementById("v-"+k).hidden=aba!==k});
 if(aba==="cad")rCad();else if(aba==="usr")rUsr();else if(aba==="fila")rFila();else if(aba==="ag")rAg();else rDash();ajustaLargura()}
document.querySelectorAll(".acc-btn").forEach(function(b){b.onclick=function(){abrirPerfil(b.dataset.p)}});
render();
var tm=setTimeout(function(){if(!pronto)document.getElementById("aviso").textContent="Não foi possível conectar ao banco de dados. Verifique a configuração do Supabase no início do arquivo."},10000);
function ok(){pronto=true;clearTimeout(tm);document.getElementById("aviso").hidden=true}
(async function(){
 try{var uu=await claude.use("user");var pp=uu&&uu.perfil?await uu.perfil():null;if(pp){PERFIL=pp.perfil;gerSel=pp.gerente||"";userEmail=pp.email||"";userNome=pp.nome||nomeEmail(userEmail)}}catch(e){}
 if(window.DICA){var dc=document.getElementById("acc-dica");dc.textContent=window.DICA;dc.hidden=false}
 ini=true;render();
 try{db=await claude.use("db")}catch(e){db=null}
 if(!db){return}
 ok();
 db.collection("cadastros").onSnapshot(function(s){cad=s.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x});var n={gerentes:[],sdrs:[],origens:[],cursos:[],canais:[],inativos:cfg.inativos||[],atendeu:cfg.atendeu||"",ultimo:cfg.ultimo};cad.forEach(function(c){if(n[c.lista])n[c.lista].push(c.nome)});cfg=n;render()},erro);
 db.doc("fila/estado").onSnapshot(function(s){cfg.ultimo=s.exists?(s.data().ultimo||""):"";render()},erro);
 db.doc("fila/inativos").onSnapshot(function(s){cfg.inativos=s.exists?(s.data().lista||[]):[];render()},erro);
 db.doc("fila/atendeu").onSnapshot(function(s){cfg.atendeu=s.exists?(s.data().nome||""):"";render()},erro);
 db.collection("agendamentos").onSnapshot(function(s){ags=s.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x});if(aba==="ag"){var ae=document.activeElement;if(ae&&ae.tagName==="INPUT"&&ae.closest("#f"))return}render()},erro);
})();
